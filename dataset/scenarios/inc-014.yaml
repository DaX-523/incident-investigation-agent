  runbooks:
  - id: rb-pricing-cache
    title: pricing-cache operations
    body: rates-db can serve roughly a 20% miss ratio from pricing-svc. After a cache flush or failover, run the pricing-warmer job to preload quotes for the top 50k hotels (about 15 minutes).
  - id: rb-search-rollback
    title: Rolling back search-api
    body: Use the deploy tool to roll back to the previous release; takes about 6 minutes for 24 pods.
  past_incidents:
  - id: PIR-2026-008
    date: '2026-02-11T00:00:00Z'
    title: Search latency after ranking model upgrade
    summary: Search p99 rose to 1.2s after a ranking model release.
    root_cause: ltr-v5 model was three times slower to score than v4 on large candidate sets.
    resolution: Rolled back the model; added a scoring-latency benchmark to the release checklist.
  - id: PIR-2026-021
    date: '2026-04-02T00:00:00Z'
    title: Slow search and deals after pricing cache restart
    summary: Search and deals timed out for about 40 minutes after pricing-cache restarted empty.
    root_cause: Cold pricing cache sent most quote lookups to rates-db, which saturated.
    resolution: Ran pricing-warmer; added the warmer step to the cache maintenance runbook.
