id: inc-014
incident_report:
  reported_at: 2026-08-21 13:45:00+00:00
  reporter: search team lead
  severity: SEV2
  title: Search slow and returning partial results since ~13:20
  description: |
    Since about 13:20 UTC hotel search is slow (p99 went from ~300ms to almost 3s) and a share of
    users get partial or empty result pages. We shipped search-api 4.2.0 with the new ranking model
    at 13:12, so the timing lines up. Should we roll back 4.2.0?
environment:
  window:
    start: 2026-08-21 12:30:00+00:00
    end: 2026-08-21 14:30:00+00:00
  topology:
    services:
    - name: web-frontend
      kind: service
      depends_on: [search-api, deals-api]
    - name: search-api
      kind: service
      depends_on: [catalog-svc, pricing-svc, feature-store]
      notes: 24 pods. Per-request deadline 2500ms. Ranks up to 40 hotels per query; ranking needs a live price quote for each.
    - name: deals-api
      kind: service
      depends_on: [pricing-svc]
    - name: catalog-svc
      kind: service
    - name: feature-store
      kind: service
    - name: pricing-svc
      kind: service
      depends_on: [pricing-cache, rates-db]
      notes: Serves rate quotes from pricing-cache; on a cache miss it queries rates-db and writes the result back.
    - name: pricing-cache
      kind: redis
      notes: 1 primary + 1 replica, automatic failover enabled.
    - name: rates-db
      kind: postgres
