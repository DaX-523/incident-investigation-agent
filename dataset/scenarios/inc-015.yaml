    start: 2026-09-03 01:30:00+00:00
    end: 2026-09-03 03:30:00+00:00
  topology:
    services:
    - name: mobile-gateway
      kind: service
      depends_on: [order-svc, cart-svc]
    - name: order-svc
      kind: service
      depends_on: [payments-svc, inventory-svc, orders-db, coredns]
      notes: 12 pods. Outbound connect timeout 2000ms, no retry on connect failure.
    - name: cart-svc
      kind: service
      depends_on: [inventory-svc, coredns]
      notes: Outbound timeout 5000ms with one retry.
    - name: payments-svc
      kind: service
      depends_on: [coredns]
    - name: inventory-svc
      kind: service
      depends_on: [coredns]
    - name: orders-db
      kind: postgres
    - name: coredns
      kind: k8s_cluster_dns
      notes: Cluster DNS (CoreDNS) deployment, 3 replicas, service IP 10.96.0.10.
