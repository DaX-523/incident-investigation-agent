id: inc-015
incident_report:
  reported_at: 2026-09-03 02:40:00+00:00
  reporter: orders on-call engineer
  severity: SEV2
  title: ~8% of order placements failing with connect timeouts to payments
  description: |
    Since about 02:08 UTC around 8% of order placements fail with "upstream connect timeout to
    payments-svc". We deployed order-svc 7.3.1 (migration to the new HTTP client) at 02:00. The
    payments team says their service is healthy. Should we roll back 7.3.1?
environment:
