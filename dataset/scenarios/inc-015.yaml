    body: Roll back with the deploy tool; about 5 minutes for 12 pods.
  past_incidents:
  - id: PIR-2026-019
    date: '2026-03-14T00:00:00Z'
    title: Checkout errors after HTTP client upgrade in cart-svc
    summary: cart-svc requests to inventory-svc failed after an HTTP client library upgrade.
    root_cause: The new client's default connection pool allowed only 2 connections per host, so requests queued and timed out.
    resolution: Rolled back, then re-released with an explicit pool size.
