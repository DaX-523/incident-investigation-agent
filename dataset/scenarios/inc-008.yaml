id: inc-008
incident_report:
  reported_at: 2026-08-21 14:05:00+00:00
  reporter: customer support
  severity: SEV2
  title: Orders stuck in "Processing", confirmation emails not sent
  description: |
    Since roughly 13:20 some customers say their order is stuck in Processing and they never
    got a confirmation email. Not all orders - most go through fine.
environment:
  window:
    start: 2026-08-21 13:00:00+00:00
    end: 2026-08-21 14:30:00+00:00
  topology:
    services:
    - name: checkout-svc
      kind: service
      depends_on: [kafka]
      notes: Produces OrderPlaced events to topic order-events (12 partitions)
    - name: kafka
      kind: kafka
      notes: 3 brokers; topic order-events RF=3
    - name: orders-worker
      kind: consumer
      depends_on: [kafka, orders-db, notification-svc]
      notes: 'StatefulSet of 12 pods, static assignment: orders-worker-N consumes partition N. No dead-letter queue.'
    - name: notification-svc
      kind: service
    - name: orders-db
      kind: postgres
    - name: logging-es
      kind: elasticsearch
      notes: centralized log search backend
  metrics:
  - service: kafka
    name: consumer_lag
    unit: messages
    labels:
      topic: order-events
      partition: '7'
    start: 2026-08-21 13:00:00+00:00
    step_seconds: 300
    values: [0, 0, 0, 0, 14, 61, 118, 170, 225, 281, 338, 392, 447, 505, 560, 618, 671, 730]
  - service: kafka
    name: consumer_lag
