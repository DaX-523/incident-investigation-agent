  runbooks:
  - id: rb-consumer-lag
    title: Kafka consumer lag
    body: Check broker health first. If a single consumer is crash-looping, inspect its logs for the failing offset; skip with `kcat`/offset reset only after saving the message.
  past_incidents:
  - id: PIR-2026-061
    date: '2026-07-30T00:00:00Z'
    title: Order processing lag during Kafka maintenance
    summary: Consumer lag rose on several partitions during a broker restart; recovered after 12 minutes.
    root_cause: Leader elections during rolling restart.
    resolution: Restart broker during low traffic.
tool_faults:
- tool: search_logs
  mode: timeout
  fails_for_attempts: null
  error_message: 'ReadTimeout: logging-es search did not complete within 30s (cluster in maintenance)'
  note: Centralized logs are unavailable for the whole window; the FATAL decode errors exist but can't be retrieved.
