  title: Card payments failing with 'Payment method could not be verified'
  description: |
    Since early morning customers can't pay by card ("Payment method could not be verified").
    UPI and wallets work. Status dashboard shows everything healthy and there are no 5xx alerts.
    The new card form went out this morning - could it be that?
