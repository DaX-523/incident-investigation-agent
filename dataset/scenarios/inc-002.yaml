    reason: IssuingFailed
    message: 'issuers.cert-manager.io "internal-ca" is forbidden: User "system:serviceaccount:cert-manager:cert-manager" cannot get resource "issuers" in namespace "payments"'
  - ts: 2026-08-02 09:14:00+00:00
    source: cert-manager
    entity: Certificate/payments-svc-mtls
    reason: IssuingFailed
    message: same as above; retry backoff 24h; certificate notAfter=2026-08-03T09:14:00Z, renewBefore=72h
  - ts: 2026-08-03 09:14:00+00:00
    source: cert-manager
    entity: Certificate/payments-svc-mtls
    reason: Expired
