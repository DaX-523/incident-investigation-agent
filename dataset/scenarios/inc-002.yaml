      operation: payments.Authorize (grpc)
      duration_ms: 4
      status: error
      attrs:
        error: 'x509: certificate has expired'
        version: v3.8.0
  changes:
  - ts: 2026-07-28 15:02:00+00:00
    kind: infra
    service: cert-manager
    summary: 'Tighten cert-manager ClusterRole to least privilege (PR #2231)'
    author: platform-team
    details: Removed get/list on issuers.cert-manager.io for namespaces outside cert-manager.
  - ts: 2026-08-03 09:08:00+00:00
    kind: deploy
    service: checkout-svc
    summary: checkout-svc v3.8.0 -> v3.8.1 (order confirmation email copy change)
    author: checkout-team
    details: Only templates/email/order_confirmation.html changed. Rollout complete 09:12.
  - ts: 2026-08-03 09:22:00+00:00
    kind: rollback
    service: checkout-svc
    summary: checkout-svc v3.8.1 -> v3.8.0 (on-call rollback)
    author: oncall
