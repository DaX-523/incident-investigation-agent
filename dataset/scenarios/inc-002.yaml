    state: firing
    summary: 5xx rate 94% > 2%
  runbooks:
  - id: rb-checkout-errors
    title: Checkout errors after a deploy
    body: If checkout errors start within 15 minutes of a checkout deploy, roll back first and investigate later.
  past_incidents:
  - id: PIR-2026-018
    date: '2026-04-02T00:00:00Z'
    title: Checkout outage after deploy
    summary: Checkout failed right after checkout-svc v3.4.0; rollback restored service within 10 minutes.
    root_cause: Bad config bundled with v3.4.0.
    resolution: Rollback; config validation added.
  - id: PIR-2025-112
    date: '2025-11-20T00:00:00Z'
    title: Expired public TLS certificate on api domain
    summary: Public api certificate expired; mobile clients failed TLS for 40 minutes.
    root_cause: Manual certificate renewal missed.
    resolution: Moved public certs to cert-manager; added expiry alerts for public endpoints.
tool_faults: []
