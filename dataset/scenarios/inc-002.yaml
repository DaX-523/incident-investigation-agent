    service: checkout-svc
    level: INFO
    message: POST /checkout 200 in 340ms
    attrs:
      version: v3.8.1
  - ts: 2026-08-03 09:14:02+00:00
    service: checkout-svc
    level: ERROR
    message: 'payment authorize failed: rpc error: code = Unavailable desc = connection error: transport: authentication handshake failed: x509: certificate has expired or is not yet valid: current time 2026-08-03T09:14:02Z is after 2026-08-03T09:14:00Z'
    attrs:
      version: v3.8.0
      pod: checkout-svc-41c-d
  - ts: 2026-08-03 09:14:05+00:00
    service: checkout-svc
    level: ERROR
    message: 'payment authorize failed: rpc error: code = Unavailable desc = connection error: transport: authentication handshake failed: x509: certificate has expired or is not yet valid'
    attrs:
