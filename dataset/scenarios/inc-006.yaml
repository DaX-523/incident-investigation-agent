    Burst of payment failures at ~10:02. payments-svc logged fraud-check errors at 10:02 and
    fraud-svc logs show it crashed/restarted at ~10:05, so it looks like our retries hammered
    fraud-svc and took it down. Can you confirm and recommend retry limits?
