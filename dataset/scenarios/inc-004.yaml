id: inc-004
incident_report:
  reported_at: 2026-10-06 12:10:00+00:00
  reporter: customer support lead
  severity: SEV2
  title: Login down for many customers - looks like a network/ISP outage
  description: |
    Lots of tickets in the last 15 minutes: customers can't log in, the spinner just hangs.
    I think it's a network outage - Cloudflare's status page shows degraded performance
    right now. Can engineering confirm it's the ISP/Cloudflare and post a status update?
