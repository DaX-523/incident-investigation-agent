    kind: ticketing
    generated_at: 2026-10-06 12:08:00+00:00
    body: '41 tickets in 15 min. Regions: DE 14, FR 9, UK 8, NL 5, other EU 5. Complaints: login spinner hangs; browsing products works.'
  alerts:
