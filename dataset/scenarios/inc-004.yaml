    name: AuthLatencyHigh
    severity: warning
    entity: auth-svc
    state: firing
    summary: p99 > 2s
  past_incidents:
  - id: PIR-2025-201
    date: '2025-12-03T00:00:00Z'
    title: EU login failures during ISP routing incident
    summary: Customers on two EU ISPs could not reach us for 50 minutes; other ISPs fine.
    root_cause: Upstream BGP route leak at a transit provider.
    resolution: Resolved by provider; no action on our side.
  - id: PIR-2026-009
    date: '2026-02-17T00:00:00Z'
    title: auth-svc slow logins
    summary: Logins slow for 20 minutes; Hikari pool saturated.
    root_cause: Missing index on sessions table made each login hold a connection longer.
    resolution: Added index.
tool_faults:
- tool: get_traces
  mode: empty
  note: Trace sampling was disabled for auth-svc; the tool returns an empty list with no error.
