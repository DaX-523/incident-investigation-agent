    - name: cdn-edge
      kind: external
      notes: Cloudflare in front of all web traffic
    - name: api-gateway
      kind: gateway
      depends_on: [auth-svc, catalog-svc]
    - name: auth-svc
      kind: service
      depends_on: [users-db]
      notes: JVM service using HikariCP
    - name: catalog-svc
      kind: service
    - name: users-db
      kind: postgres
