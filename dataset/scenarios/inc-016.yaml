id: inc-016
incident_report:
  reported_at: 2026-09-15 09:40:00+00:00
  reporter: partner support lead
  severity: SEV2
  title: Partners getting 5xx from the tracking API since ~09:00
  description: |
    Several logistics partners report HTTP 500/503 from the shipment tracking API since about 09:00
    UTC, roughly one call in eight. FinOps reduced the tracking-api database connection pool at
    08:55 and the errors say the pool is exhausted. Should we just revert the pool change?
environment:
  window:
    start: 2026-09-15 08:30:00+00:00
    end: 2026-09-15 10:30:00+00:00
  topology:
    services:
    - name: partner-api
      kind: gateway
      depends_on: [tracking-api]
    - name: tracking-api
      kind: service
      depends_on: [tracking-db, events-queue]
      notes: Read-mostly API over shipment events. Connection pool acquire timeout 2000ms.
    - name: webhook-ingest
      kind: service
      depends_on: [tracking-db, events-queue]
      notes: Writes carrier webhook events into tracking-db.
    - name: data-jobs
      kind: batch
      depends_on: [tracking-db]
      notes: Kubernetes namespace for ad-hoc data maintenance jobs.
    - name: events-queue
      kind: queue
    - name: tracking-db
      kind: postgres
      notes: Single primary, provisioned 10000 write IOPS.
