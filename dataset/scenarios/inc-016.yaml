  - id: rb-db-pool
    title: Tuning service DB pools
    body: Pool size should cover peak concurrent queries with 50% headroom. Pool exhaustion is usually a symptom of slow queries; check DB latency before resizing.
  past_incidents:
  - id: PIR-2026-024
    date: '2026-05-20T00:00:00Z'
    title: billing-api timeouts after connection pool reduction
    summary: billing-api returned 503s after its DB pool was reduced during a cost review.
    root_cause: Pool sized below peak concurrency during month-end invoicing.
    resolution: Reverted the pool size; added a month-end load check to pool changes.
