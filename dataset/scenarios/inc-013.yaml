  - id: rb-sip-errors
    title: Outbound SIP failures
    body: "Carrier 429/503 count as a failed attempt; the attempt is retried after a fixed 120s. A contact is marked UNREACHABLE after 4 attempts."
  external_reports:
  - name: carrier_cdr_summary_2026-03-10
    kind: carrier_cdr
    generated_at: 2026-03-11T03:00:00Z
    body: |
      Trunk summary 2026-03-10 (UTC):
      contracted concurrent channels: 80
      peak concurrent channels: 24
      INVITE attempts rejected (429): 71%
  - name: carrier_support_reply
    kind: vendor_email
    generated_at: 2026-03-11T04:30:00Z
    body: "Your trunk exceeded its call-attempt rate (15 attempts/second, all INVITEs counted) for most of 10 March from ~05:00 UTC; excess INVITEs were rejected with 429. Please reduce your attempt rate."
  past_incidents:
  - {id: PIR-2026-004, date: 2026-01-22T00:00:00Z, title: "Outbound calls failing - carrier outage", summary: "All INVITEs failed with 503 for 40 minutes.", root_cause: "Carrier-side SBC failure.", resolution: "Resolved by carrier; no action on our side."}
tool_faults:
- tool: search_logs
  match: {service: dialer}
  mode: truncated
  keep_first_n: 2
  note: Log backend caps results without saying so; the agent sees only the first rejections, not the UNREACHABLE outcome.
