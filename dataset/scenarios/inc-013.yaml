id: inc-013
incident_report:
  reported_at: 2026-03-11T05:00:00Z
  reporter: customer success (enterprise customer escalation)
  severity: SEV2
  title: Contacts marked UNREACHABLE without their phones ever ringing
  description: |
    A customer says thousands of contacts in yesterday's outbound campaign were marked
    UNREACHABLE, but the ones they spot-checked never received a call. Connect rate collapsed
    from ~05:00 UTC. Is the carrier down, or are we exceeding our channel limit?
environment:
  window:
    start: 2026-03-10T03:30:00Z
    end: 2026-03-11T06:00:00Z
  topology:
    services:
    - {name: campaign-scheduler, kind: scheduler, depends_on: [dialer, campaign-db], notes: "Dispatches due call attempts every 10s at a configured rate of 12 calls/sec"}
    - {name: dialer, kind: worker, depends_on: [sip-gateway, campaign-db], notes: "Places outbound calls"}
    - {name: sip-gateway, kind: sip_gateway, depends_on: [carrier-trunk]}
    - {name: carrier-trunk, kind: external, notes: "Telecom carrier SIP trunk. Contract: 80 concurrent channels, 15 call attempts/sec"}
    - {name: campaign-db, kind: postgres}
  metrics:
  - {service: dialer, name: sip_invite_rejection_ratio, unit: ratio, labels: {code: "429"}, start: 2026-03-10T04:00:00Z, step_seconds: 1800,
     values: [0.01, 0.04, 0.15, 0.38, 0.59, 0.69, 0.71, 0.70, 0.72, 0.70, 0.71, 0.69, 0.70, 0.72, 0.71, 0.70, 0.71]}
  - {service: dialer, name: sip_invites_per_min, unit: per_min, start: 2026-03-10T04:00:00Z, step_seconds: 1800,
     values: [260, 480, 690, 820, 900, 960, 990, 985, 992, 988, 990, 986, 991, 989, 990, 987, 988]}
  - {service: dialer, name: active_calls, unit: count, start: 2026-03-10T04:00:00Z, step_seconds: 1800,
     values: [10, 19, 24, 23, 21, 20, 22, 21, 20, 22, 23, 21, 20, 22, 21, 20, 21]}
  - {service: campaign-scheduler, name: contacts_marked_unreachable_total, unit: count, start: 2026-03-10T04:00:00Z, step_seconds: 1800,
     values: [0, 0, 25, 240, 760, 1450, 2180, 2900, 3640, 4360, 5090, 5820, 6540, 7270, 7990, 8720, 9440]}
  - {service: dialer, name: sip_invites_per_min, unit: per_min, labels: {resolution: 1m}, start: 2026-03-10T07:00:00Z, step_seconds: 60,
     values: [1290, 720, 1285, 718, 1292, 721, 1288, 719, 1290, 722, 1286, 720, 1291, 718, 1289, 721, 1287, 720, 1292, 719, 1288, 722, 1290, 718, 1286, 721, 1289, 720, 1291, 719]}
